version: '3.8'

services:
  app:
    image: tathar26/v-ops:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_NAME=V-Ops
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=vops_prod
      - DB_USERNAME=vops
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - prod-storage:/var/www/html/storage

  scheduler:
    image: tathar26/v-ops:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      - APP_NAME=V-Ops
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=vops_prod
      - DB_USERNAME=vops
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - prod-storage:/var/www/html/storage

  queue:
    image: tathar26/v-ops:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work"]
    environment:
      - APP_NAME=V-Ops
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=vops_prod
      - DB_USERNAME=vops
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - prod-storage:/var/www/html/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - prod-redis:/data

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: vops_prod
      MYSQL_USER: vops
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: 
      - --innodb_buffer_pool_size=4G
      - --innodb_log_file_size=512M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_flush_method=O_DIRECT
      - --max_connections=250
      - --thread_cache_size=64
      - --query_cache_type=0
      - --query_cache_size=0
      - --key_buffer_size=32M
    volumes:
      - prod-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 3
      timeout: 5s

volumes:
  prod-mariadb:
    driver: local
  prod-redis:
    driver: local
  prod-storage:
    driver: local
