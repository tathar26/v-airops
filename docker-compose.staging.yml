version: '3.8'

services:
  app:
    image: tathar26/v-ops:devel
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_NAME=V-Ops-Staging
      - APP_ENV=staging
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=http://staging.v-ops.local
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=vops_staging
      - DB_USERNAME=vops
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - staging-storage:/var/www/html/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - staging-redis:/data

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: vops_staging
      MYSQL_USER: vops
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging-mariadb:/var/lib/mysql
      - ./docker/mariadb.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 3
      timeout: 5s

volumes:
  staging-mariadb:
    driver: local
  staging-redis:
    driver: local
  staging-storage:
    driver: local
